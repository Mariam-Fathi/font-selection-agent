[project]
name = "font-selection-agent"
version = "0.2.0"
description = "An AI agent that tries fonts on your real UI, verifies what rendered, and checks the layout."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.0",
    "google-genai>=1.0",
    "playwright>=1.45",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "pandas>=2.0", "scipy>=1.10"]

[tool.setuptools]
packages = ["fontagent", "agents", "tools", "benchmark"]

[tool.setuptools.package-data]
fontagent = ["page.js", "data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "browser: needs a local Chromium (python -m playwright install chromium)",
    "network: also needs access to fonts.googleapis.com",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
